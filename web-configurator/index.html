<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Google tag (gtag.js) — the hosted site only.
       ⚠ The same dist/ is wrapped by Capacitor for the iOS and Android apps, so
       a plain <script> tag here would ship analytics inside both store
       binaries. That is not a neutral change: Apple's App Privacy labels and
       Play's Data Safety form would both have to declare the collection, and
       undeclared collection is a rejection rather than a warning. Keep it on
       the web, where it is just a page doing what pages do.

       ⚠ Gated on the ORIGIN, not on `window.Capacitor`. The bridge sets that
       global, but whether it has run before this inline script is an injection
       ordering detail that differs between the two platforms — and getting it
       wrong fails in the direction that ships the tag. The origins are fixed
       and knowable: iOS serves `capacitor://localhost`, Android serves
       `https://localhost` (capacitor.config.ts sets androidScheme). The bridge
       check is kept as a belt-and-braces third signal only.

       Development origins are excluded for the same reason: `make web-dev`
       serves localhost, and `make web-host` serves a LAN IP so a phone can
       reach it — that one is the whole phone-testing loop, and it would
       otherwise put a session in the property every time you reload. -->
  <script>
    (function () {
      var host = location.hostname;
      var cap = window.Capacitor;

      var isLocal =
        host === "localhost" ||
        host === "127.0.0.1" ||
        host === "[::1]" ||
        /\.local$/.test(host) ||
        // RFC1918, i.e. `make web-host` on the LAN.
        /^10\./.test(host) ||
        /^192\.168\./.test(host) ||
        /^172\.(1[6-9]|2\d|3[01])\./.test(host);

      var isNativeShell =
        location.protocol === "capacitor:" ||
        location.protocol === "file:" ||
        !!(cap && (typeof cap.isNativePlatform === "function"
          ? cap.isNativePlatform()
          : cap.isNative));

      if (isLocal || isNativeShell) return;

      var MEASUREMENT_ID = "G-Q97B4RG7LV";
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + MEASUREMENT_ID;
      document.head.appendChild(s);

      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag("js", new Date());
      gtag("config", MEASUREMENT_ID);
    })();
  </script>

  <!-- ⚠ Deliberately NOT an SVG favicon. Browsers prefer `image/svg+xml` over
       the .ico when both are offered, and AlloyFlux_Logo.svg is pale mint
       line-art on transparency — which disappears into a light tab strip. The
       generated .ico carries the same mark on the dark panel ground, so it
       reads on both light and dark, and matches the installed app's icon. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alloy Controller</title>

  <!-- ⚠ Catch `beforeinstallprompt` here, not in the app.
       Chrome fires it as soon as the install criteria are met, which is
       routinely *before* the module bundle has executed — so a listener added
       in a component's onMount misses it entirely and the install tip never
       appears. The event fires once and is not replayed.

       So: stash it on `window` from an inline script in <head>, which runs
       before anything else, and re-announce it under our own name for whatever
       mounts later. `PwaStatus.svelte` reads the stashed event if it is already
       there and otherwise waits for either signal. -->
  <script>
    window.__alloyInstallPrompt = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      // Suppresses Chrome's own mini-infobar so our tip is the only prompt.
      e.preventDefault();
      window.__alloyInstallPrompt = e;
      window.dispatchEvent(new Event("alloy:installprompt"));
    });
    window.addEventListener("appinstalled", function () {
      window.__alloyInstallPrompt = null;
    });
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
