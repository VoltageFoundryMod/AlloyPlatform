; PlatformIO Project Configuration File
;
;   AlloyFlux — Juno-inspired Eurorack DCO
;   Hardware: Raspberry Pi Pico 2 (RP2350) + PCM5102A I2S DAC
;
; I2S wiring (PCM5102A):
;   Pico 2 GP26 → BCK  (Bit clock)        — WS must be BCK+1 for PIO
;   Pico 2 GP27 → LCK  (Word select / LRCLK)
;   Pico 2 GP28 → DIN  (Serial data)
;   Pico 2 3V3  → VCC, XSMT  (tie high — normal operation)
;   GND         → GND, FLT, DMP, SCL, FMT (pull low = I2S slave, MCU drives clocks)

[env:alloyflux]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
monitor_echo  = true
build_flags =
    -DSERIAL_CONTROL            ; serial dev console — remove for production build
    -DMOZZI_I2S_PIN_BCK=26
    -DMOZZI_I2S_PIN_WS=27
    -DMOZZI_I2S_PIN_DATA=28
lib_deps =
    sensorium/Mozzi
    ; FortySevenEffects/MIDI Library  ; enabled at milestone 12 (hardware MIDI)
    ; arduino-libraries/MIDIUSB       ; enabled at milestone 13 (USB MIDI)
