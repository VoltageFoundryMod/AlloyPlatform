; PlatformIO Project Configuration File
;
;   AlloyFlux — Juno-inspired Eurorack DCO
;   Hardware: Raspberry Pi Pico 2 (RP2350) + PCM5102A I2S DAC
;
; I2S wiring (PCM5102A):
;   Pico 2 GP16 → BCK  (Bit clock)        — WS must be BCK+1 for PIO
;   Pico 2 GP17 → LCK  (Word select / LRCLK)
;   Pico 2 GP18 → DIN  (Serial data)
;   Pico 2 3V3  → VCC, XSMT  (tie high — normal operation)
;   GND         → GND, FLT, DMP, SCL, FMT (pull low = I2S slave, MCU drives clocks)

[platformio]
src_dir = .
; What a bare `pio run`, the PlatformIO toolbar buttons and the VS Code tasks
; build when nothing names an environment.
;
; Wireless is the default on both modules, which is why the plain env names are
; the 2W ones and the non-radio builds carry the `_wired` suffix rather than the
; other way round. The suffix marks the exception, so every default path — the
; IDE, `pio run`, `make` — produces the image that ships, and nobody has to
; remember a flag to get it.
;
; Pick `alloycoil` in the PlatformIO sidebar for the other module. `make`
; drives all four through MODULE= and WIRELESS=.
default_envs = alloyflux

[env:alloyflux_wired]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 250000000L
; One env per module. The engine is selected by which module's sources and
; include root are on the build, so two modules never share an image.
build_src_filter =
    -<*>
    +<platform/src/>
    +<modules/alloyflux/src/>
board_build.usb_manufacturer = "Voltage Foundry Modular"
board_build.usb_product = "Alloy Flux"
monitor_speed = 115200
monitor_echo  = false
build_flags =
    -Iplatform/include
    -Imodules/alloyflux/include
    -I${sysenv.RACK_DIR}/include
    -I${sysenv.RACK_DIR}/dep/include
    ; -DAUDIO_TEST_TONE         ; generate a 1kHz sine wave for audio path testing
    -DSERIAL_CONTROL            ; serial dev console — remove for production build
    -DCPU_PROFILE               ; audio block timing + DMA underflow counter (milestone 8)
    -DUSE_TINYUSB               ; enable Adafruit TinyUSB — composite CDC + MIDI device (milestone 29)
    ; Experiment hook — must stay LAST here so an override wins. env:alloyflux
    ; inherits it through ${env:alloyflux_wired.build_flags}. See the Makefile's
    ; ECHO_S / ECHO_DECIM / DMA_BUF knobs.
    ${sysenv.ALLOY_FLAGS}
; Audio rate, control rate and the I2S pins are deliberately NOT build flags:
; the sample rate is a property of the module, not the project, so it lives in
; modules/alloyflux/src/main.cpp (kAudioRate / kControlRate / kPinI2s*).
; DELAY_MAX_MS is likewise defined once in modules/alloyflux/include/dsp/
; DelayEngine.h so hardware and the VCV plugin cannot drift apart.
lib_deps =
    I2S     ; bundled with the earlephilhower core (framework-arduinopico/libraries/I2S).
            ; Must be named explicitly — without an entry here the LDF does not
            ; scan the framework's library directory.
; NOTE: do NOT add adafruit/Adafruit TinyUSB Library here. The earlephilhower
; core already bundles it (framework-arduinopico/libraries/Adafruit_TinyUSB_Arduino)
; and -DUSE_TINYUSB above is what activates it. Pulling the registry copy as well
; compiles those sources against the framework's headers, which fails with
; "unknown type name 'tu_edpt_state_t'" in usbd.c / usbh.c.
    fortyseveneffects/MIDI Library      ; MIDI message parsing + dispatch (milestone 27/29)
; platform/src/ble_midi.cpp is on every env's build (it is the file that makes
; `bleMidi_*()` link to no-ops without a radio), and its `#include <BLE.h>` sits
; inside `#else` on an `#ifndef ALLOY_BLE`. The LDF does not evaluate that: it
; regex-scans for #include and would pull the core's BLE library into this
; non-Bluetooth build, where its btstack calls are compiled out of the headers
; and it fails with a wall of "not declared in this scope". Ignore it here and
; un-ignore it in env:alloyflux. The alternative, lib_ldf_mode = chain+, would
; fix it by running the preprocessor over every library in the tree — a much
; larger change to how dependencies resolve, for one file.
lib_ignore = BLE

; ---------------------------------------------------------------------------
; Alloy Flux on a Pico 2W — the same firmware with BLE MIDI added (M78b).
;
; A second env rather than a flag on the first, because what differs is the
; *board*: rpipico2w carries the CYW43 firmware blob and defines
; PICO_CYW43_SUPPORTED. Everything else is inherited, so both images run the
; same engine at the same rate from the same sources.
;
; This is what makes "wireless is an addition, never a dependency" a build
; property rather than a promise: `make firmware WIRELESS=0` produces an image
; with no radio code in it at all — ble_midi.cpp compiles to empty stubs
; without ALLOY_BLE — and that image is what a plain Pico 2 should run.
;
; This is the DEFAULT AlloyFlux build: the plain env name is the 2W one and the
; non-radio build is env:alloyflux_wired, so the IDE buttons, a bare `pio run`
; and `make firmware` all produce the shipping image without anyone setting a
; flag. The suffix marks the exception.
;
; ⚠ Flashing THIS image onto a non-W board is not the supported fallback.
; bleMidi_init() only checks cyw43_is_initialized(), which never touches the
; chip, so BLEClass::begin()'s unbounded wait for an HCI address may still hang.
; The probe that did detect a missing radio brought the WiFi stack up and cost
; ~147 us of every audio block, so it was reverted — see M78f. Build
; WIRELESS=0 for a non-W board instead.
;
; The 2W is pin-compatible. The radio's GP23/24/25/29 are all pins AlloyFlux
; does not use; the only casualty is the "GP25 onboard LED, debug only" row in
; AlloyFlux-hardware-design.md, because on a 2W that LED sits on the CYW43.
;
; No overclock note is needed here even though this inherits f_cpu = 250 MHz:
; the core's init_cyw43_wifi() already drops the cyw43 PIO clock divisor from
; /2 to /4 at >= 250 MHz, because the SPI bus does not survive /2 that fast.
;
; Alloy Coil ships wireless too — env:alloycoil below. Getting there took /6
; echo decimation for RAM, 230.4 MHz for CPU, 8 I2S buffers for the jitter a
; radio causes, and M81's move of the hot path out of XIP into RAM. It now runs
; at 490 us against a 666 us budget with BLE up and a host connected, which is
; more headroom than the wired module ever had.
; ---------------------------------------------------------------------------
[env:alloyflux]
extends = env:alloyflux_wired
board = rpipico2w
; Override the inherited `lib_ignore = BLE` — this is the one env that wants it.
lib_ignore =
build_flags =
    ${env:alloyflux_wired.build_flags}
    -DALLOY_BLE                            ; compile in platform/src/ble_midi.cpp
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH ; links liblwip-bt.a; sets ENABLE_BLE

; ---------------------------------------------------------------------------
; Alloy Coil — feedback resonator (Synthux Academy engine, vendored).
;
; A second env, not a second build of the same one: engine selection is
; compile-time because AlloyFlux (~318 KB) and Alloy Coil (~443 KB) cannot be
; co-resident in 520 KB. Only this module's sources and include root are on the
; build, so the two never share an image — which is also what lets each pick its
; own sample rate.
; ---------------------------------------------------------------------------
[env:alloycoil_wired]
extends = env:alloyflux_wired
; 192 MHz, not the 150 MHz default.
;
; Measured on hardware at 150 MHz: 690 us against a 666 us block budget —
; every block late, ~70 DMA underruns/sec, continuous crackle. The engine is
; simply heavier than the part's stock clock, by about 4%.
;
; 192 MHz is chosen, not rounded to: the I2S bit clock is 48000 x 32 x 2 =
; 3.072 MHz, and the PIO divides the system clock by a 16.8 fixed-point value,
; so sysclk / 3.072 MHz must land on a multiple of 1/256 or the real sample
; rate drifts and every note goes flat.
;     150.0 MHz -> 48.828125  exact (stock)
;     192.0 MHz -> 62.5       exact  <-- +28%, this
;     230.4 MHz -> 75.0       exact  (+53%, if 192 is not enough)
;     200.0 MHz -> 65.104...  NOT exact: ~0.16% rate error, ~2.8 cents flat
;
; +28% turns 690 us into ~539 us, i.e. ~19% headroom. Well inside what the
; RP2350 runs at reliably on stock voltage, but it is an overclock: if this
; board proves unstable, drop back to 150 and reduce DSP cost instead.
board_build.f_cpu = 192000000L
build_src_filter =
    -<*>
    +<platform/src/>
    +<modules/alloycoil/src/>
    +<vendor/daisysp/>
board_build.usb_manufacturer = "Voltage Foundry Modular"
board_build.usb_product = "Alloy Coil"
build_flags =
    -Iplatform/include
    -Imodules/alloycoil/include
    -Ivendor/daisysp
    -DSERIAL_CONTROL
    -DCPU_PROFILE
    -DUSE_TINYUSB
    ; Echo storage: /4 decimation + Q15 + a 4 s ceiling is what makes the
    ; engine fit. See modules/alloycoil/README.md for the size table and the
    ; A/B switches.
    ;
    ; The 4 s ceiling is NOT defined here. It is the #ifndef default in
    ; FeedbackSynthEngine.h, deliberately: defining it here too meant that
    ; `make ... ECHO_S=2` produced a *second* -D and 278 "macro redefined"
    ; warnings on every build. One definition, in the header, and the
    ; experiment hook below overrides it cleanly.
    ; Experiment hook, and it has to be the LAST entry here.
    ;
    ; `make ... ECHO_S=2 ECHO_DECIM=4` exports ALLOY_FLAGS, which lands after
    ; everything above so its -D wins — the last definition on the command line
    ; is the one the compiler keeps. PLATFORMIO_BUILD_FLAGS does NOT work for
    ; this: PlatformIO *prepends* it, so the -D above overrides the override and
    ; the build silently ignores you (it compiles, links, and the RAM figure
    ; does not move — which is how that was caught).
    ;
    ; Empty when ALLOY_FLAGS is unset, so a normal build is unaffected.
    ${sysenv.ALLOY_FLAGS}

; ---------------------------------------------------------------------------
; Alloy Coil on a Pico 2W — EXPERIMENTAL, and its fate is M78f's to decide.
;
; Coil does not link with BLE as it ships: 477 604 B leaves 46 684 B free and
; BLE costs 79 KB. It fits only by giving the echo back, and the echo is the
; module. Two configurations cost the same and were measured:
;
;     4 s at /6  -> 494 424 B (94.3 %), 29.9 KB heap   <-- this
;     4 s at /8  -> 462 424 B (88.2 %), 61.9 KB heap
;     2 s at /4  -> 462 424 B (88.2 %), 61.9 KB heap
;
; /6 keeps the full 4 s and is the conservative first try: the anti-alias
; cutoff is decim_rate x 0.25, so it moves 3000 -> 2000 Hz, into a band the
; loop's own 800 Hz / 12 dB-per-octave filter has already gutted. What actually
; needs measuring is the interpolator's reconstruction imaging, which M63f-ab
; found and could not filter away — /4 images at 12000-f, /6 at 8000-f, so the
; image moves *down* toward the content. `make coil-ab` gives that in dB.
;
; ⚠ 94.3 % is tight. The free figure is heap and only heap (the core stacks
; live in SCRATCH_X/Y, outside RAM), and BTstack allocates from static pools
; rather than the heap, so 29.9 KB should be enough — but nothing else may grow.
;
; ⚠ The real question is CPU, not RAM. Coil has 13.2 % block headroom (578 us
; against 666) against AlloyFlux's ~64 %, and cyw43's DMA contends with core 1
; reading a 128 KB echo buffer. Watch `cpu` and the underrun count.
;
; Pairing is a 3 s hold on WARP — BUTTON_1 / SW2, the same physical switch
; AlloyFlux calls MODE, so the gesture sits in the same place on both modules.
; That only works because WARP is a toggle rather than momentary, and because
; the toggle lands on the release edge: a press that turns into a hold is marked
; consumed, so pairing does not move warp at all. Alloy Coil's LEDs are not
; firmware-driven, so there is no panel feedback; the console prints
; `warp held -> ble <state>`.
; ---------------------------------------------------------------------------
[env:alloycoil]
extends = env:alloycoil_wired
board = rpipico2w
; 230.4 MHz, not the 192 the wired Coil uses — measured, not chosen for luck.
;
; Having BTstack and the cyw43 driver up costs this module **~147 us per block**
; and Coil only had ~81 us of headroom, so at 192 MHz the wireless build is not
; marginal, it is unusable: 585 us wired against ~732 us wireless on a 666 us
; budget, every block late, continuous underruns. `ble poll 0` changes nothing,
; so it is not MIDI work — it is background contention for bus and XIP cache
; that exists whether the radio is idle, advertising or connected.
;
; 230.4 is the next exact I2S divider up (75.0; see the table in [env:alloycoil_wired])
; and buys 20%: ~732 -> ~610 us, i.e. +8.4% headroom. Thin. If it is not enough,
; ECHO_DECIM=8 is the next lever and costs echo bandwidth rather than length.
;
; ⚠ The core only drops the cyw43 PIO SPI divisor from /2 to /4 at >= 250 MHz,
; so this runs the radio's bus ~20% faster than the 192 MHz that is known good.
; If BLE turns flaky after this, that is the first thing to try — add
; -DCYW43_PIO_CLOCK_DIV_INT=4 rather than blaming the overclock itself.
board_build.f_cpu = 230400000L
lib_ignore =
build_flags =
    ${env:alloycoil_wired.build_flags}
    -DCOIL_ECHO_DECIMATION=6               ; 8 kHz echo loop — buys the 64 KB
    ; 8 x 32 frames = 5.3 ms of I2S queue, against the platform default 2.7 ms.
    ;
    ; Measured, and it is the fix for the clicks a radio causes. Two separate
    ; problems needed two separate answers: 230.4 MHz above fixes the *average*
    ; (at 192 MHz the block ran ~732 us against a 666 us budget, a permanent
    ; deficit no amount of buffering survives), and this fixes the *jitter* —
    ; cyw43 PIO-SPI DMA stalls core 1 for reasons unrelated to how much DSP
    ; there is to run, so blocks that would land at ~605 us occasionally arrive
    ; at ~710 us instead.
    ;
    ; That it is a stall and not work is what `smooth 64` and `ECHO_DECIM=8`
    ; established by *not* helping: neither made the spikes smaller. A deeper
    ; queue does not make a block faster, it gives the DAC something to play
    ; while core 1 is held off the bus. Result: underruns went from climbing at
    ; 10-160/s to flat at 3, with slow blocks still occurring and now harmless.
    ;
    ; The cost is output latency, so this is the smallest depth measured to
    ; work rather than the one with the most margin: 4 (2.7 ms) clicks, 8
    ; (5.3 ms) is clean, 12 (8.0 ms) is clean. 8 it is — the true minimum is
    ; somewhere in 5..8 and not worth the flashes to find, but if a future
    ; change makes the stalls longer this is the first number to raise.
    -DAUDIO_DMA_BUFFERS=8
    -DALLOY_BLE
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    ; Last again, so ECHO_S / ECHO_DECIM beat both the inherited flags above
    ; and this env's own decimation. See the note in [env:alloycoil_wired].
    ${sysenv.ALLOY_FLAGS}
